# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and Deploy ASP.NET Core App to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write  # Required for federated token access
  contents: read   # Adjust as needed for your workflow

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'  # Adjust to your target .NET version

      - name: Build
        run: dotnet build Smartstore.sln -c Release

      - name: Publish
        run: dotnet publish src/Smartstore.Web/Smartstore.Web.csproj -c Release -o ./output

      - name: List output files
        run: ls ./output  # Verify that files are generated

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartstore-artifact
          path: ./output

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: smartstore-artifact

      - name: 'Login to Azure'
        uses: azure/login@v2
        with:
          clientId: ${{ secrets.AZURE_CLIENT_ID }}
          clientSecret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tenantId: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}  # Optional
          environment: azurecloud

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Smartstore'  # Replace with your Azure Web App name
          slot-name: 'Production'
          package: './output'  # Path to the published output
